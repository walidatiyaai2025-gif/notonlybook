name: PHP Theme Lint

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
      - 'closure/**'

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Show PHP version and source
        run: |
          php --version
          echo "SOURCE_SHA=${SOURCE_SHA}"
      - name: Lint theme PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -print0)
